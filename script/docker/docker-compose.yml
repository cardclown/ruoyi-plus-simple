name: ruoyi-local

services:
  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: ry_vue
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ry_vue"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8.6.3
    container_name: redis
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - ./redis/conf:/redis/config:ro
      - redis-data:/redis/data
    command: ["redis-server", "/redis/config/redis.conf"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ruoyi123 ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: pgsty/minio:RELEASE.2026-04-17T00-00-00Z
    container_name: minio
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: ruoyi
      MINIO_ROOT_PASSWORD: ruoyi123
      MINIO_COMPRESS: "off"
      MINIO_COMPRESS_EXTENSIONS: ""
      MINIO_COMPRESS_MIME_TYPES: ""
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
      - minio-config:/root/.minio
    command: ["server", "--address", ":9000", "--console-address", ":9001", "/data"]
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  minio-config:
