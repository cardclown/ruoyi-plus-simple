--- # 临时文件存储位置；必须为当前应用实例独占，进程内上传租约不协调其他实例
spring.servlet.multipart.location: /ruoyi/server/temp

oss:
  cleanup:
    interval: PT1H

--- # 数据源配置
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    dynamic:
      p6spy: false
      primary: master
      strict: true
      datasource:
        master:
          type: ${spring.datasource.type}
          driverClassName: org.postgresql.Driver
          # PostgreSQL 原生服务仅监听本机 15432，并要求 TCP 连接使用 TLS。
          url: jdbc:postgresql://localhost:15432/ry_vue?reWriteBatchedInserts=true&sslmode=require
          username: postgres
          password: postgres123
      hikari:
        maxPoolSize: 10
        minIdle: 2
        connectionTimeout: 30000
        validationTimeout: 5000
        idleTimeout: 600000
        maxLifetime: 1800000
        keepaliveTime: 30000

--- # redis 单机配置
spring.data:
  redis:
    host: localhost
    # Redis 原生服务仅监听本机 16379；公网入口配置不参与应用内部连接。
    port: 16379
    database: 0
    password: ruoyi123
    timeout: 10s
    ssl.enabled: false

# redisson 配置
redisson:
  keyPrefix:
  threads: 4
  nettyThreads: 8
  singleServerConfig:
    clientName: RuoYi-Vue-Plus
    connectionMinimumIdleSize: 8
    connectionPoolSize: 32
    idleConnectionTimeout: 10000
    timeout: 3000
    subscriptionConnectionPoolSize: 50
