--- # 数据源配置
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    dynamic:
      # 开发环境保留 SQL 性能分析，生产环境关闭
      p6spy: true
      primary: master
      strict: true
      datasource:
        master:
          type: ${spring.datasource.type}
          driverClassName: org.postgresql.Driver
          url: jdbc:postgresql://localhost:5432/ry_vue?reWriteBatchedInserts=true
          username: postgres
          password: postgres123
      hikari:
        # 单体服务控制连接数，给 PostgreSQL 和系统其他组件留出内存
        maxPoolSize: 10
        minIdle: 2
        connectionTimeout: 30000
        validationTimeout: 5000
        idleTimeout: 600000
        maxLifetime: 1800000
        keepaliveTime: 30000

--- # redis 单机配置
spring.data:
  redis:
    host: localhost
    port: 6379
    database: 0
    password: ruoyi123
    timeout: 10s
    ssl.enabled: false

# redisson 配置
redisson:
  keyPrefix:
  threads: 4
  nettyThreads: 8
  singleServerConfig:
    clientName: RuoYi-Vue-Plus
    connectionMinimumIdleSize: 8
    connectionPoolSize: 32
    idleConnectionTimeout: 10000
    timeout: 3000
    subscriptionConnectionPoolSize: 50
